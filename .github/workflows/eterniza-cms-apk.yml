name: Gerar APK Eterniza CMS

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-cms/**'
      - '.github/workflows/eterniza-cms-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Instalar SDK Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de teste
        working-directory: android-cms
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Eterniza-CMS-Android-APK
          path: android-cms/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
