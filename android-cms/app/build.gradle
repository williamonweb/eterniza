plugins { id 'com.android.application' }

android {
    namespace 'br.com.eternizas.cms'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.eternizas.cms'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
